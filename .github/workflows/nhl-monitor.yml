name: NHL scoring-discrepancy monitor

# Runs the snapshot-diff monitor on a schedule:
#   * every 15 minutes — catches in-game review overturns and scorer edits
#     as the official play-by-play mutates
#   * 17:30 UTC daily — re-audits the last days for postgame "OFFICIAL
#     SCORING CHANGE" updates that land after the final buzzer
#
# The monitor only talks to the official NHL web API (api-web.nhle.com),
# stores snapshots under data/snapshots/ and appends detections to
# data/alerts/feed.json, then commits any changes back to main.
# See README.md and the website's "Monitor & detection" section for the
# documented limits of what this can and cannot detect.

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: nhl-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify monitor logic (offline self-test)
        run: python3 monitor/nhl_monitor.py --self-test

      - name: Run snapshot monitor (today + last 3 days)
        run: python3 monitor/nhl_monitor.py --days 4

      - name: Notify — open an issue for any new discrepancy alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/alerts/ISSUE_BODY.md ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Possible NHL scoring discrepancy detected $(date -u +%Y-%m-%d\ %H:%M)Z" \
              --body-file data/alerts/ISSUE_BODY.md \
              || echo "::warning::Could not open issue (may need issue permissions)."
          else
            echo "No new alerts this run."
          fi

      - name: Commit any new snapshots/alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/alerts
          if ! git diff --cached --quiet; then
            git commit -m "monitor: snapshot updates and discrepancy alerts"
            git push
          else
            echo "No changes to commit."
          fi
