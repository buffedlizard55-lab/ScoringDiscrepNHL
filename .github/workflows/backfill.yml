name: historical backfill

# Builds the historical census. Methods (see docs/BACKFILL.md and docs/LIMITATIONS.md):
#   era          - frozen-era official document vs the league's current database
#   archive      - two archived captures of the same official document, compared
#   change-scan  - walk a game range through the archive index, compare what changed
#   archive-yield- MEASURE how much of history the archive can even show (per season)
#   coverage     - measure per-season official-report availability and era
#
# This job is deliberately manual: it walks thousands of games, so it should be run in
# slices (a game-number range or one season at a time) and its output reviewed.
# Every method that produces records also raises alerts for them (same feed as the
# 5-minute monitor), so a census finding cannot land silently.

on:
  workflow_dispatch:
    inputs:
      method:
        description: "era | archive | change-scan | archive-yield | coverage"
        required: true
        default: "era"
      season:
        description: "Season folder start year, e.g. 20052006 (era, change-scan)"
        required: false
        default: "20052006"
      game_type:
        description: "1 pre-season, 2 regular season, 3 playoffs"
        required: false
        default: "2"
      start:
        description: "first game number (era, change-scan)"
        required: false
        default: "1"
      end:
        description: "last game number (era, change-scan)"
        required: false
        default: "50"
      game_id:
        description: "single game id (method=archive)"
        required: false
        default: "2023020001"
      kind:
        description: "report kind for the archive methods: GS | ES | PL | RO"
        required: false
        default: "GS"
      from_season:
        description: "first season start year (archive-yield)"
        required: false
        default: "2005"
      to_season:
        description: "last season start year (archive-yield)"
        required: false
        default: "2026"
      game_numbers:
        description: "sampled game numbers per season (archive-yield)"
        required: false
        default: "1,500,1100"

permissions:
  contents: write
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the selected census method
        run: |
          set -o pipefail
          METHOD="${{ github.event.inputs.method }}"
          if [ "$METHOD" = "coverage" ]; then
            PYTHONPATH=src python -m nhl_monitor coverage \
              --from-season 1999 --to-season 2026 | tee backfill_output.json
          elif [ "$METHOD" = "archive-yield" ]; then
            PYTHONPATH=src python -m nhl_monitor archive-yield \
              --from-season "${{ github.event.inputs.from_season }}" \
              --to-season "${{ github.event.inputs.to_season }}" \
              --game-numbers "${{ github.event.inputs.game_numbers }}" \
              --kind "${{ github.event.inputs.kind }}" | tee backfill_output.json
          elif [ "$METHOD" = "change-scan" ]; then
            PYTHONPATH=src python -m nhl_monitor archive-scan \
              --season "${{ github.event.inputs.season }}" \
              --game-type "${{ github.event.inputs.game_type }}" \
              --start "${{ github.event.inputs.start }}" \
              --end "${{ github.event.inputs.end }}" \
              --kind "${{ github.event.inputs.kind }}" \
              --out "data/reference/change_scan_${{ github.event.inputs.season }}_${{ github.event.inputs.kind }}.json" \
              | tee backfill_output.json
          elif [ "$METHOD" = "archive" ]; then
            PYTHONPATH=src python -m nhl_monitor backfill-archive \
              --game-id "${{ github.event.inputs.game_id }}" \
              --kind "${{ github.event.inputs.kind }}" | tee backfill_output.json
          else
            PYTHONPATH=src python -m nhl_monitor backfill-era \
              --season "${{ github.event.inputs.season }}" \
              --game-type "${{ github.event.inputs.game_type }}" \
              --start "${{ github.event.inputs.start }}" \
              --end "${{ github.event.inputs.end }}" | tee backfill_output.json
          fi

      - name: Port new records into the canonical database, rebuild the published site, export CSV
        if: always()
        run: |
          node tools/check_site.mjs
          # The census writes monitor-line records; the published site renders the
          # canonical database, so the lossless port runs first - otherwise a
          # backfill could add records the site never shows.
          python3 scripts/import_parallel_records.py
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli validate
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli alerts --write --limit 50 --recent-days 14
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli site
          PYTHONPATH=src python -m nhl_monitor export-csv --out data/exports/discrepancies.csv

      - name: Notify subscribers about alerts that are new since the last run
        # A backfill can legitimately produce many historical records; the delivery
        # layer caps per-alert issues per run and folds the rest into one digest,
        # so a census cannot flood the issue tracker.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDN_WEBHOOK_URL: ${{ secrets.SDN_WEBHOOK_URL }}
        run: |
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli notify \
            --channels feed,issue,webhook,email --allow-failure \
            --run-label "backfill-${GITHUB_RUN_ID}"

      - name: Commit the evidence
        run: |
          git config user.name  "scoring-backfill[bot]"
          git config user.email "scoring-backfill@users.noreply.github.com"
          git add data index.html app.js styles.css data.js .nojekyll
          if git diff --cached --quiet; then
            echo "no new records from this slice"
          else
            git commit -m "backfill: ${{ github.event.inputs.method }} ${{ github.event.inputs.season }} games ${{ github.event.inputs.start }}-${{ github.event.inputs.end }} [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backfill-output-${{ github.run_id }}
          path: backfill_output.json
          retention-days: 30
