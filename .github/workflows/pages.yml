name: Deploy site to GitHub Pages

# Assembles site/ (app) + data/ (database) into one artifact and deploys it.
# Triggered on any push to main, so every monitor commit redeploys the site.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the monitor
  # explicitly dispatches this event after committing data changes.
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/data
          cp data/discrepancies.json data/alerts.json data/alerts.xml data/coverage_report.json _site/data/ 2>/dev/null || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
