name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline, synthetic fixtures)
        run: python3 -m unittest discover -s tests -v
      - name: Validate data files
        run: python3 -m pipeline.main validate
      - name: Site asset sanity
        run: |
          test -f index.html
          test -f js/normalize.js
          test -f js/app.js
          test -f css/style.css
          test -f .nojekyll
          test -f data/discrepancies.json
          test -f data/records/discrepancies.json
          test -f data/alerts.json
          node --check js/normalize.js
          node --check js/app.js
      # The published site is the repository root (Pages: branch main, path /).
      # `node --check` only proves the file parses, which is how a renderer that
      # printed "? @ ?" for every record reached main. This runs the real client
      # against the real committed data.
      - name: Smoke-test the PUBLISHED site client against the committed data
        run: node tools/check_root_site.mjs
      - name: The alert feed the site reads must not be empty while alerts exist
        run: PYTHONPATH=src:pipeline python3 -m unittest tests.test_alert_feed -v
