name: scoring-monitor

# Scheduled detection: snapshot official NHL scoring state and diff it.
# On a detected change, upload the alert artifact and open a GitHub Issue.
# The monitor NEVER edits the database itself — humans verify first.
on:
  schedule:
    # Every 30 minutes during peak North-American game hours, Oct-Jun.
    # (Cron is UTC; 22:00-06:00 UTC ≈ afternoon/evening ET.)
    - cron: "*/30 22-23 * 10-12 *"
    - cron: "*/30 0-6 * 10-12 *"
    - cron: "*/30 22-23 * 1-6 *"
    - cron: "*/30 0-6 * 1-6 *"
    # Daily sweep year-round (catches late corrections in offseason backfill windows)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "3"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore snapshots
        uses: actions/cache@v4
        with:
          path: scripts/snapshots
          key: nhl-snapshots-v1

      - name: Validate database
        run: python scripts/validate.py

      - name: Run monitor
        run: python scripts/monitor.py --check-recent ${{ inputs.days || '3' }}

      - name: Upload alerts artifact
        uses: actions/upload-artifact@v4
        with:
          name: scoring-alerts
          path: scripts/alerts.json
          retention-days: 30

      - name: Open issue on detection
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/alerts.json ]; then
            echo "No alerts.json produced (earlier step failed); skipping issue creation."
            exit 0
          fi
          COUNT=$(python -c "import json;print(len(json.load(open('scripts/alerts.json')).get('alerts',[])))")
          echo "alert_count=$COUNT"
          if [ "$COUNT" -gt 0 ]; then
            BODY=$(python -c "
          import json
          d = json.load(open('scripts/alerts.json'))
          lines = [f\"Detected {len(d['alerts'])} candidate scoring change(s) at {d['checked_utc']} (games checked: {d['games_checked']}).\", '', 'Human verification required before adding to the database.', '']
          for a in d['alerts']:
              lines.append(f\"- [{a['alert_type']}] game {a['game_id']} ({a.get('away')} at {a.get('home')}) P{a.get('period')} {a.get('clock')}: {a['detail']} after_final={a.get('after_final', False)}\")
          print('\n'.join(lines))
          ")
            gh issue create --title "[ALERT] $COUNT candidate scoring change(s) detected" --body "$BODY" --label "scoring-alert"
          fi
