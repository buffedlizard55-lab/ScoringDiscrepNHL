name: scoring monitor

# Continuous detection. Runs every 5 minutes; the collector only writes when the
# official record for a game has actually changed, so most runs commit nothing.
# GitHub cron is UTC and can be delayed a few minutes at busy times - treat the
# schedule as "at least every ~10 minutes", not as a real-time feed.
#
# REPAIR NOTE (2026-10-07): this file was pushed to main with unresolved merge
# conflict markers, breaking every run. It has been reconstructed verbatim from
# the HEAD side of that conflicted merge — the active implementation of the
# parallel line (src/nhl_monitor). The other line's monitor (pipeline/) remains
# parked at monitor_root_site.yml.disabled. See docs/parallel_line/PARALLEL_LINE.md.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to monitor (YYYY-MM-DD). Default: today"
        required: false

concurrency:
  group: scoring-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect the slate and detect changes
        id: collect
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          PYTHONPATH=src python -m nhl_monitor monitor $ARGS --github-issue --repo "$GITHUB_REPOSITORY" | tee monitor_output.json
          echo "alerts=$(python - <<'PY'
          import json
          try:
              blob = json.load(open("monitor_output.json"))
          except Exception:
              print(0); raise SystemExit
          total = sum(len(r.get("alerts", [])) for r in blob.get("results", []))
          print(total)
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Port new monitor-line records into the canonical database and rebuild the site
        # The root site renders data/discrepancies.json (the engine database). The
        # port is lossless and idempotent (scripts/import_parallel_records.py) and
        # only runs when this pass actually changed the monitor line's record file,
        # so quiet runs stay quiet.
        run: |
          if git diff --quiet -- data/records/discrepancies.json; then
            echo "no new monitor-line records this run"
          else
            python3 scripts/import_parallel_records.py
            PYTHONPATH=pipeline python3 -m nhl_scoring.cli validate
            PYTHONPATH=pipeline python3 -m nhl_scoring.cli site
          fi

      - name: Commit the evidence timeline and any new records
        run: |
          git config user.name  "scoring-monitor[bot]"
          git config user.email "scoring-monitor@users.noreply.github.com"
          git add data/ index.html app.js styles.css data.js .nojekyll
          if git diff --cached --quiet; then
            echo "no changes in the official records this run"
          else
            git commit -m "monitor: capture official state $(date -u +'%Y-%m-%dT%H:%MZ') (alerts: ${{ steps.collect.outputs.alerts }})"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase || exit 1
            done
          fi

      # GitHub Pages serves the repository root of main (legacy build), so the push
      # above is the deploy; no separate Pages workflow is needed.

      - name: Upload the run output for auditing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-output-${{ github.run_id }}
          path: monitor_output.json
          retention-days: 30
