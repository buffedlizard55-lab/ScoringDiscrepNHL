name: Scoring engine monitor

# The "eliminate manual checking" half: poll the day's games, snapshot every state
# change, derive temporal findings, merge them into the database, publish the alert
# digest, and rebuild the site. GitHub's scheduler is 15-minute-granular and often
# later than that, so this is "near-real-time"; docs/STATUS.md documents the
# always-on runner path for genuinely in-game latency.

on:
  # Deliberately NOT scheduled: the monitor line already owns a 15-minute cron in
  # monitor.yml, and two schedulers pushing to main is how you get a commit war and
  # a rate-limit ban. Dispatch this one to run the engine's snapshot+alert pass, or
  # flip the schedule here when one line is chosen as the single monitor.
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to poll instead of today/yesterday"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dates to poll (today and yesterday UTC, plus any in-flight games)
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "list=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(date -u -d 'yesterday' +%F) $(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi
      - name: Snapshot each game's live state (digests are written only on change)
        run: |
          for d in ${{ steps.dates.outputs.list }}; do
            echo "== snap $d"
            PYTHONPATH=pipeline python3 -m nhl_scoring.cli snap --date "$d" || echo "::warning::snap failed for $d"
          done
      - name: Derive temporal findings from the accumulated snapshots
        run: PYTHONPATH=pipeline python3 -m nhl_scoring.cli snapfind --out out/temporal.json
      - name: Merge findings into the database
        run: |
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli merge --findings out/temporal.json --db data/discrepancies.json --apply --strict
      - name: Validate + render alerts
        run: |
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli validate
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli alerts --write --limit 40
      - name: Rebuild the site from the updated database (repository root is what GitHub Pages serves)
        run: PYTHONPATH=pipeline python3 -m nhl_scoring.cli site
      - name: Notify subscribers about alerts that are new since the last run
        # Replaces the previous `gh issue create --label detection` step, which
        # could never have worked: the repository has no `detection` label, `gh`
        # fails on an unknown label, and a `|| echo` swallowed the failure. The
        # delivery layer creates any label it needs and records the outcome in
        # data/notifications/last_run.json instead of pretending.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDN_WEBHOOK_URL: ${{ secrets.SDN_WEBHOOK_URL }}
          SDN_SMTP_HOST: ${{ secrets.SDN_SMTP_HOST }}
          SDN_SMTP_PORT: ${{ secrets.SDN_SMTP_PORT }}
          SDN_SMTP_USER: ${{ secrets.SDN_SMTP_USER }}
          SDN_SMTP_PASSWORD: ${{ secrets.SDN_SMTP_PASSWORD }}
          SDN_SMTP_FROM: ${{ secrets.SDN_SMTP_FROM }}
          SDN_SMTP_TO: ${{ secrets.SDN_SMTP_TO }}
        run: |
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli notify \
            --channels feed,issue,webhook,email --allow-failure \
            --run-label "engine-monitor-${GITHUB_RUN_ID}"
      - name: Commit what changed
        run: |
          git config user.name  "scoring-discrepancy-bot"
          git config user.email "bot@users.noreply.github.com"
          # `data` (not a list of paths) so the shared feed, the RSS file, the
          # deliver-once state and the delivery report are all committed with the
          # records they describe.
          git add data index.html app.js styles.css data.js .nojekyll || true
          if ! git diff --cached --quiet; then
            git commit -m "monitor: $(date -u +%FT%TZ) snapshot + alert pass"
            git push origin HEAD:main
          else
            echo "no state change captured this run"
          fi
