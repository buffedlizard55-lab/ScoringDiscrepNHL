name: Situation Room ingest

# The NHL publishes an official statement for every coach's challenge and video
# review (see pipeline/nhl_scoring/situation_room.py). This job pulls the feed,
# classifies each statement, cross-checks overturned calls against the official
# play-by-play, merges records into data/discrepancies.json, rebuilds the site
# and commits. It is the primary alert path for goal <-> no-goal reversals.
#
# Cadence reality: GitHub schedules cron workflows on a best-effort basis and
# throttles repositories heavily (measured on this repo: one scheduled run in
# eleven hours for a */5 cron). Twice an hour is requested; expect less. Anyone
# who needs minutes-level latency should trigger this workflow from an external
# scheduler via `gh workflow run "Situation Room ingest"` or the REST dispatch
# endpoint - the job itself takes about a minute in incremental mode.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental (newest pages until nothing new), full (walk the whole feed) or reparse (re-run the parser on the stored statements, no feed fetch)"
        required: false
        default: "incremental"
      max_pages:
        description: "Feed pages of 100 statements to read"
        required: false
        default: "2"
      start_skip:
        description: "Offset into the feed (full mode only)"
        required: false
        default: "0"
      max_crosscheck:
        description: "Play-by-play documents to fetch for cross-checking this run"
        required: false
        default: "150"
  schedule:
    - cron: "11,41 * * * *"
  # A committed request file also starts a run (useful on branches, where the
  # dispatch API cannot see the workflow). The job consumes and deletes it; the
  # bot's own push uses GITHUB_TOKEN and therefore never re-triggers this.
  push:
    paths:
      - "data/situation_room/run_request.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: situation-room-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve run parameters (inputs, or a committed run_request.json)
        env:
          MODE: ${{ github.event.inputs.mode || 'incremental' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '2' }}
          START_SKIP: ${{ github.event.inputs.start_skip || '0' }}
          MAX_XC: ${{ github.event.inputs.max_crosscheck || '150' }}
        run: |
          REQ=data/situation_room/run_request.json
          if [ -f "$REQ" ]; then
            echo "using $REQ: $(cat "$REQ")"
            MODE=$(python3 -c "import json;print(json.load(open('$REQ')).get('mode','incremental'))")
            MAX_PAGES=$(python3 -c "import json;print(json.load(open('$REQ')).get('max_pages',2))")
            START_SKIP=$(python3 -c "import json;print(json.load(open('$REQ')).get('start_skip',0))")
            MAX_XC=$(python3 -c "import json;print(json.load(open('$REQ')).get('max_crosscheck',150))")
          fi
          { echo "MODE=$MODE"; echo "MAX_PAGES=$MAX_PAGES"; echo "START_SKIP=$START_SKIP"; echo "MAX_XC=$MAX_XC"; } >> "$GITHUB_ENV"
      - name: Ingest the official Situation Room feed
        run: |
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli situation-room \
            --mode "$MODE" --max-pages "$MAX_PAGES" --start-skip "$START_SKIP" \
            --max-crosscheck "$MAX_XC" --apply --verbose \
            --out out/situation_room_findings.json
      - name: Validate the database
        run: PYTHONPATH=pipeline python3 -m nhl_scoring.cli validate
      - name: Render alerts
        run: PYTHONPATH=pipeline python3 -m nhl_scoring.cli alerts --write --limit 50 --recent-days 14
      - name: Notify subscribers about alerts that are new since the last run
        # Detection is only half the job: without this step the feed updates and
        # nobody hears about it. Delivery is deduplicated through
        # data/notifications_state.json, so a run that finds nothing new sends
        # nothing, and a run that finds one overturned goal opens exactly one
        # issue. Unconfigured channels are reported as skipped, never as sent.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDN_WEBHOOK_URL: ${{ secrets.SDN_WEBHOOK_URL }}
          SDN_SMTP_HOST: ${{ secrets.SDN_SMTP_HOST }}
          SDN_SMTP_PORT: ${{ secrets.SDN_SMTP_PORT }}
          SDN_SMTP_USER: ${{ secrets.SDN_SMTP_USER }}
          SDN_SMTP_PASSWORD: ${{ secrets.SDN_SMTP_PASSWORD }}
          SDN_SMTP_FROM: ${{ secrets.SDN_SMTP_FROM }}
          SDN_SMTP_TO: ${{ secrets.SDN_SMTP_TO }}
        run: |
          PYTHONPATH=pipeline python3 -m nhl_scoring.cli notify \
            --channels feed,issue,webhook,email --allow-failure \
            --run-label "situation-room-${GITHUB_RUN_ID}"
      - name: Rebuild the site (repository root is what GitHub Pages serves)
        run: PYTHONPATH=pipeline python3 -m nhl_scoring.cli site
      - name: Commit and push
        run: |
          git config user.name  "scoring-discrepancy-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q --ignore-unmatch data/situation_room/run_request.json
          git add data index.html app.js styles.css data.js .nojekyll || true
          if git diff --cached --quiet; then
            echo "nothing new in the Situation Room feed"
            exit 0
          fi
          git commit -m "situation-room: $(date -u +%FT%TZ) ingest ($MODE)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
      - name: Fail the run if a notification channel failed
        # Runs after the commit so the data is never lost to a notification
        # outage, but the outage is still surfaced instead of sitting in a file.
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = "data/notifications/last_run.json"
          if not os.path.exists(path):
              print("no delivery report written this run"); sys.exit(0)
          report = json.load(open(path, encoding="utf-8"))
          failed = report.get("failed_channels") or []
          print(f"delivery: {len(report.get('delivered_alert_ids') or [])} alert(s), failures: {failed}")
          for d in report.get("deliveries") or []:
              print(f"  {d.get('channel')}: {d.get('status')} {d.get('error') or d.get('url') or ''}")
          sys.exit(1 if failed else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: situation-room-findings
          path: out/situation_room_findings.json
          if-no-files-found: ignore
